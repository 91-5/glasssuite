<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GlassDesk Free</title>
    <!-- 游离图标页（v0.7 Phase 1 · OC-20261102-002）。
         卡面 §1.3-6：游离窗口**只渲染极简 DOM**，不加载完整 React bundle——
         每个游离图标 = 一个 WebView2，实例膨胀是真实成本（软上限 30 个）。
         内容：一个 <img>（图标）+ 运行指示条 + 悬停名称。 -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        cursor: default;
      }
      #hit {
        position: absolute;
        left: 0;
        top: 0;
        width: 48px;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: grab;
      }
      #hit.dragging {
        cursor: grabbing;
      }
      #icon {
        width: 32px;
        height: 32px;
        image-rendering: auto;
        -webkit-user-drag: none;
      }
      #rundot {
        position: absolute;
        bottom: 2px;
        left: 50%;
        transform: translateX(-50%);
        width: 18px;
        height: 3px;
        border-radius: 2px;
        background: linear-gradient(90deg, #5ac8fa, #0078d4);
        box-shadow: 0 0 6px rgba(0, 120, 212, 0.75);
        display: none;
        pointer-events: none;
      }
      #label {
        position: absolute;
        top: 50px;
        left: 0;
        width: 48px;
        padding: 1px 2px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.6);
        font: 11px/1.25 "Segoe UI", "Microsoft YaHei", sans-serif;
        color: rgba(25, 25, 25, 0.9);
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        opacity: 0;
        transition: opacity 120ms ease;
        pointer-events: none;
      }
      #label.show {
        opacity: 1;
      }
      #err {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        font: 10px/1.2 "Segoe UI", sans-serif;
        color: rgba(160, 30, 30, 0.9);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="hit">
      <img id="icon" alt="" />
      <span id="rundot"></span>
    </div>
    <div id="label"></div>
    <div id="err"></div>
    <script>
      (function () {
        var data = window.__GD_FREE__ || {};
        var icon = document.getElementById("icon");
        var dot = document.getElementById("rundot");
        var label = document.getElementById("label");
        var hit = document.getElementById("hit");
        var errBox = document.getElementById("err");

        function showError(msg) {
          errBox.style.display = "flex";
          errBox.textContent = msg;
        }

        // 图标：RGBA base64 → canvas → PNG data URL（<img>，不引任何前端框架）
        try {
          var bin = atob(data.rgba || "");
          var bytes = new Uint8ClampedArray(bin.length);
          for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          var c = document.createElement("canvas");
          c.width = data.w || 32;
          c.height = data.h || 32;
          c.getContext("2d").putImageData(new ImageData(bytes, c.width, c.height), 0, 0);
          icon.src = c.toDataURL("image/png");
        } catch (e) {
          showError("icon decode failed");
        }
        label.textContent = data.name || "";

        // 运行指示条（由 Rust 侧 running::is_running 驱动，**只调用不改**）
        window.gdSetRun = function (v) {
          dot.style.display = v ? "block" : "none";
        };

        // IPC：Tauri v2 的 __TAURI_INTERNALS__ 恒在（与 withGlobalTauri 无关）
        function invoke(cmd, args) {
          try {
            if (window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke) {
              return window.__TAURI_INTERNALS__.invoke(cmd, args);
            }
          } catch (e) {}
          showError("IPC unavailable");
          return Promise.reject(new Error("IPC unavailable"));
        }

        // 悬停显示图标名（Phase 1 不做 DWM 缩略图预览——preview.rs 禁动）
        hit.addEventListener("mouseenter", function () {
          label.classList.add("show");
        });
        hit.addEventListener("mouseleave", function () {
          label.classList.remove("show");
        });

        // 拖动：**阈值检测在前端，窗口移动交给系统**（WM_NCLBUTTONDOWN/HTCAPTION）。
        // 前端绝不用 pointer capture 去「拖窗口」——那样窗口不动、光标会跑出窗口。
        var startX = 0,
          startY = 0,
          dragging = false,
          handedOff = false;
        hit.addEventListener("pointerdown", function (e) {
          if (e.button !== 0) return;
          startX = e.clientX;
          startY = e.clientY;
          dragging = false;
          handedOff = false;
          try {
            hit.setPointerCapture(e.pointerId);
          } catch (err) {}
        });
        hit.addEventListener("pointermove", function (e) {
          if (handedOff) return;
          var dx = e.clientX - startX,
            dy = e.clientY - startY;
          if (Math.abs(dx) < 4 && Math.abs(dy) < 4) return;
          dragging = true;
          handedOff = true;
          hit.classList.add("dragging");
          try {
            hit.releasePointerCapture(e.pointerId);
          } catch (err) {}
          // 交接给系统原生拖动（模态移动循环 → WM_MOVING → 无抖动）
          invoke("free_begin_drag", { id: data.id }).catch(function () {});
        });
        hit.addEventListener("pointercancel", function () {
          dragging = false;
        });

        // 单击/双击 → 启动或激活（复用 dock::activate_or_launch 的快路径）
        hit.addEventListener("click", function () {
          if (dragging) return; // 拖完的那次 click 不算
          invoke("free_launch", { id: data.id }).catch(function () {});
        });
        hit.addEventListener("dblclick", function (e) {
          e.preventDefault();
        });

        // 右键 → 收回 dock
        hit.addEventListener("contextmenu", function (e) {
          e.preventDefault();
          invoke("free_return", { id: data.id }).catch(function () {});
        });

        // 首帧画完 → 上报（Rust 收到才显示窗口，避免 WebView2 未画完的黑闪）
        window.gdReady = function () {
          invoke("free_ready", { id: data.id }).catch(function () {});
        };
        if (document.readyState === "complete") {
          setTimeout(window.gdReady, 0);
        } else {
          window.addEventListener("DOMContentLoaded", function () {
            setTimeout(window.gdReady, 0);
          });
        }
      })();
    </script>
  </body>
</html>
