[workspace]
resolver = "2"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["GlassSuite contributors"]

[workspace.dependencies]
# Win32 绑定统一版本，平台层与 shell 不得各自声明不同版本。
windows = "0.62"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
