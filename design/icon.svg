<svg width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.55" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#eaf1ff"/>
      <stop offset="1" stop-color="#c3d6ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.6">
      <stop offset="0" stop-color="#93c5fd" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#93c5fd" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- 单一连通形状：dock 底座 + 岛从中央升起 -->
  <path d="M 212,840
           L 212,752 Q 212,692 272,692
           L 360,692
           C 360,520 380,280 512,280
           C 644,280 664,520 664,692
           L 752,692
           Q 812,692 812,752
           L 812,840
           Z"
        fill="url(#glass)"/>

  <!-- 岛顶光泽 -->
  <path d="M 430,380 C 445,310 470,282 512,282 C 554,282 579,310 594,380
           C 560,340 464,340 430,380 Z" fill="#ffffff" opacity="0.7"/>
</svg>
