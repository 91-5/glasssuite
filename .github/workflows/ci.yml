name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Frontend typecheck + build
        run: |
          pnpm check
          pnpm -r build

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  build:
    needs: check
    # PR 只跑 check；main 与 v* tag 才出包，避免把未验收功能打进发布物。
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build NSIS + updater artifacts
        env:
          # 私钥只在 GitHub Actions secrets；公钥在 tauri.conf.json，仓库里没有私钥。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build

      - name: Portable zip + SHA256SUMS
        shell: pwsh
        run: |
          $cfg = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $v = $cfg.version
          # cargo workspace 根在仓库根，target/ 也在根；不要写成 src-tauri/target/release。
          $release = "target/release"
          $out = "bundle-out"
          New-Item -ItemType Directory -Force $out | Out-Null

          # Tauri 的 Windows 产物是单文件 exe（WebView2 用系统运行时），便携包只需它 + 说明。
          Copy-Item "$release/GlassSuite.exe" "$out/GlassSuite.exe" -Force
          Copy-Item README.md "$out/README.txt" -Force
          $zip = Join-Path $out "GlassSuite_${v}_x64-portable.zip"
          Compress-Archive -Path "$out/GlassSuite.exe", "$out/README.txt" -DestinationPath $zip -Force

          $nsis = Get-ChildItem -Path "$release/bundle/nsis" -Filter "*.exe" -File
          $assets = @($nsis) + @(Get-Item $zip)
          $updater = Get-ChildItem -Path "$release/bundle" -Filter "latest.json" -File -Recurse -ErrorAction SilentlyContinue
          if ($updater) { $assets += $updater }

          $lines = foreach ($f in $assets) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($f.Name)"
          }
          # 显式写无 BOM 的 UTF-8：Windows PowerShell 5.1 的 -Encoding utf8 会带 BOM，
          # 校验工具会把 BOM 当成第一个文件名的前导字符，导致首行校验失败。
          $sumPath = Join-Path $out "SHA256SUMS"
          [System.IO.File]::WriteAllText(
            $sumPath,
            ($lines -join "`n") + "`n",
            (New-Object System.Text.UTF8Encoding($false))
          )
          Get-Content $sumPath

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: glasssuite-${{ github.sha }}
          path: |
            target/release/bundle/nsis/*.exe
            bundle-out/*.zip
            bundle-out/SHA256SUMS

      - name: Attach assets to the pre-release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.sig
            target/release/bundle/**/latest.json
            bundle-out/*.zip
            bundle-out/SHA256SUMS
