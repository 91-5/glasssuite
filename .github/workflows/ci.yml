name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Frontend typecheck + build
        run: |
          pnpm check
          pnpm -r build

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  build:
    needs: check
    # Package builds only on main pushes and v* tags; PRs run check only.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build NSIS + updater artifacts
        uses: tauri-apps/tauri-action@action-v0.6.2
        with:
          args: --bundles nsis
          updaterJsonPreferNsis: true
        env:
          # Private key lives only in GitHub Actions secrets; the public key
          # is in tauri.conf.json and is committed to the repo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Portable zip + SHA256SUMS
        shell: pwsh
        run: |
          $cfg = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $v = $cfg.version
          # The cargo workspace root is the repo root, so target/ is at the root.
          # Do NOT write src-tauri/target/release.
          $release = "target/release"
          $out = "bundle-out"
          New-Item -ItemType Directory -Force $out | Out-Null

          # The Tauri Windows build is a single-file exe (WebView2 comes from the
          # system runtime), so the portable package is just exe + readme.
          Copy-Item "$release/GlassSuite.exe" "$out/GlassSuite.exe" -Force
          Copy-Item README.md "$out/README.txt" -Force
          $zip = Join-Path $out "GlassSuite_${v}_x64-portable.zip"
          Compress-Archive -Path "$out/GlassSuite.exe", "$out/README.txt" -DestinationPath $zip -Force

          $nsis = Get-ChildItem -Path "$release/bundle/nsis" -Filter "*.exe" -File
          $assets = @($nsis) + @(Get-Item $zip)
          $updater = Get-ChildItem -Path "$release/bundle" -Filter "latest.json" -File -Recurse -ErrorAction SilentlyContinue
          if ($updater) { $assets += $updater }

          $lines = foreach ($f in $assets) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($f.Name)"
          }
          # Write UTF-8 without BOM explicitly: Windows PowerShell 5.1's
          # -Encoding utf8 adds a BOM, and verifiers treat the BOM as leading
          # characters of the first filename, which breaks the first line.
          $sumPath = Join-Path $out "SHA256SUMS"
          [System.IO.File]::WriteAllText(
            $sumPath,
            ($lines -join "`n") + "`n",
            (New-Object System.Text.UTF8Encoding($false))
          )
          Get-Content $sumPath

          # Explicitly build the updater manifest. tauri-action's implicit
          # latest.json was not produced when the tag was re-created, so we
          # construct it ourselves from the CI-signed .sig (private key lives
          # only in Actions secrets) — deterministic and independent of that
          # race. The public key in tauri.conf.json verifies this signature.
          $sigPath = "$release/bundle/nsis/GlassSuite_${v}_x64-setup.exe.sig"
          if (-not (Test-Path $sigPath)) { throw "missing signature: $sigPath" }
          $sig = [System.IO.File]::ReadAllText($sigPath).Trim()
          $latest = [ordered]@{
            version = $v
            notes = "2026-11-21 fixes: control-page false-alarm root cause (camelCase), hotkey Ctrl+Alt+H fallback, notification polarity, dock click main-thread, self-preview, preview click."
            pub_date = [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $sig
                url = "https://github.com/91-5/glasssuite/releases/download/v${v}/GlassSuite_${v}_x64-setup.exe"
              }
            }
          }
          $latestPath = Join-Path $out "latest.json"
          [System.IO.File]::WriteAllText(
            $latestPath,
            ($latest | ConvertTo-Json -Depth 6),
            (New-Object System.Text.UTF8Encoding($false))
          )
          "generated $latestPath"
          Get-Content $latestPath

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: glasssuite-${{ github.sha }}
          path: |
            target/release/bundle/nsis/*.exe
            bundle-out/*.zip
            bundle-out/SHA256SUMS
            bundle-out/latest.json

      - name: Attach assets to the pre-release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.sig
            bundle-out/latest.json
            bundle-out/*.zip
            bundle-out/SHA256SUMS
